version: '3.8'

services:
  numdum-app:
    build:
      context: .
      args:
        NODE_ENV: ${NODE_ENV:-development}
        PORT: ${PORT:-4356}
    ports:
      - "${PORT:-4356}:${PORT:-4356}"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${PORT:-4356}
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped
